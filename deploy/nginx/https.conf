# EvaCal — nginx с TLS. Устанавливается deploy/install.sh как nginx.conf.
# Сертификаты: ./certs/fullchain.pem и ./certs/privkey.pem (том из docker-compose.tls.yml).
# __HTTPS_PORT_SUFFIX__ установщик заменяет на «:порт», если HTTPS не на 443 (иначе на пусто):
# $host не содержит порта, и редирект на нестандартный порт иначе его терял бы.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  gzip on;
  gzip_min_length 1000;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Весь HTTP — на HTTPS; проверка здоровья остаётся доступной по HTTP.
  server {
    listen 80;
    server_name _;

    location = /api/health {
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
    }

    location / {
      return 301 https://$host__HTTPS_PORT_SUFFIX__$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Загружаемые спецификации вендоров — до нескольких МБ; синхронно с MAX_UPLOAD_BYTES
    # в app/api/gost34/parse-vendor-doc.
    client_max_body_size 12m;

    location /api/gost34/draft-tz {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Генерация черновика ТЗ через LLM идёт дольше обычного запроса.
      proxy_read_timeout 300s;
    }

    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
