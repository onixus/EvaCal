# Только встроенный PostgreSQL. Для внешней БД этот overlay не подключается.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evacal}
      POSTGRES_USER: ${POSTGRES_USER:-evacal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
  migrate:
    depends_on:
      postgres:
        condition: service_healthy
  app:
    depends_on:
      postgres:
        condition: service_healthy
