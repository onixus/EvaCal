# Compatibility stack for pre-overlay managers (through 0.6.0). Keep postgres
# inline: old evacal update downloads this file but cannot add new COMPOSE_FILE entries.
# New installations use docker-compose.base.yml + the postgres overlay instead.
name: ${COMPOSE_PROJECT_NAME:-evacal}

x-database: &database
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-evacal}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-evacal}?schema=public}

x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evacal}
      POSTGRES_USER: ${POSTGRES_USER:-evacal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  migrate:
    image: ${EVACAL_MIGRATE_REF:-${EVACAL_MIGRATE_IMAGE:-ghcr.io/onixus/evacal-migrate}:${EVACAL_TAG:-latest}}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
    # Нельзя монтировать /app/prisma: старый том скрывает новые миграции и seed.
    volumes:
      - storage-data:/app/storage
    logging: *logging

  app:
    image: ${EVACAL_APP_REF:-${EVACAL_IMAGE:-ghcr.io/onixus/evacal}:${EVACAL_TAG:-latest}}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SHARE_TOKEN_SECRET: ${SHARE_TOKEN_SECRET:-}
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-}
      EVACAL_LOCAL_HTTP: ${EVACAL_LOCAL_HTTP:-false}
      GOST_PACKAGE_STORAGE: ${GOST_PACKAGE_STORAGE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      LMSTUDIO_HOST: ${LMSTUDIO_HOST:-}
      EVACAL_LLM_DISABLE_LOCAL: ${EVACAL_LLM_DISABLE_LOCAL:-}
      EVACAL_LLM_PROVIDERS: ${EVACAL_LLM_PROVIDERS:-}
      EVACAL_LLM_DEFAULT_PROVIDER: ${EVACAL_LLM_DEFAULT_PROVIDER:-}
      EVACAL_LLM_ALLOW_LOOPBACK: ${EVACAL_LLM_ALLOW_LOOPBACK:-}
      EVACAL_LLM_ALLOW_PRIVATE_NETWORK: ${EVACAL_LLM_ALLOW_PRIVATE_NETWORK:-}
    volumes:
      - storage-data:/app/storage
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          cpus: ${EVACAL_APP_CPUS:-2.0}
          memory: ${EVACAL_APP_MEMORY:-2048M}
    logging: *logging

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${EVACAL_BIND_ADDRESS:-0.0.0.0}:${EVACAL_HTTP_PORT:-80}:80'
    volumes:
      - ./nginx:/etc/nginx/evacal:ro
    command: ['nginx', '-c', '/etc/nginx/evacal/nginx.conf', '-g', 'daemon off;']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/api/health || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    logging: *logging

  # Клиент PostgreSQL в той же сети, в том числе для внешнего DATABASE_URL.
  # Профиль не запускается при обычном up; используется только через compose run.
  db-tools:
    image: postgres:16-alpine
    profiles: ['tools']
    environment:
      <<: *database

volumes:
  pg-data:
  storage-data:
