name: Publish Docker pair (manual fallback)

# Jenkins is primary. No automatic push/PR triggers or runner-minute consumption.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing release tag or branch'
        required: true
        default: main
      dry_run:
        description: 'Build only, without publishing'
        type: boolean
        default: true
      multiarch:
        description: 'Build amd64 + arm64 (otherwise native amd64)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: evacal-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.multiarch }}
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test, build pair, smoke, promote and package
        env:
          REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          MULTIARCH: ${{ inputs.multiarch }}
          EVACAL_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash scripts/docker-publish.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: evacal-deploy
          path: dist/*-deploy.tar.gz*
          if-no-files-found: error
