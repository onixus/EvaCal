name: CI

# ОТКЛЮЧЕНО: заменено локальным Jenkins (Jenkinsfile, джоба «Ева»).
# Причина — лимиты минут GitHub Actions. Локальный пайплайн повторяет job
# verify шаг в шаг: npm ci, prisma generate, npm audit, lint, format, typecheck,
# test (через test:ci), build.
# Вернуть: раскомментировать push/pull_request ниже.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  # prisma.config.ts резолвит DATABASE_URL при любом запуске CLI, включая generate
  DATABASE_URL: 'postgresql://evacal:evacal@127.0.0.1:5432/evacal?schema=public'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evacal
          POSTGRES_PASSWORD: evacal
          POSTGRES_DB: evacal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U evacal -d evacal"
          --health-interval 5s --health-timeout 3s --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: PostgreSQL migrations and integration
        run: |
          npm run db:sync
          npm run db:sync
          npm run test:postgres

      - name: Security audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

      # Mirrors the Jenkinsfile stages. Test runs even when lint fails so a
      # formatting nit can never hide a red test again.
      - name: Lint
        id: lint
        run: npm run lint

      - name: Format
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Deployment contracts
        if: ${{ !cancelled() }}
        run: npm run test:deploy

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  docker-data-exclusion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production images and reject local database files
        run: bash scripts/test-docker-data-exclusion.sh
