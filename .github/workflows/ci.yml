name: CI

# ОТКЛЮЧЕНО: заменено локальным Jenkins (Jenkinsfile, джоба «Ева»).
# Причина — лимиты минут GitHub Actions. Локальный пайплайн повторяет job
# verify шаг в шаг: npm ci, prisma generate, npm audit, lint, typecheck,
# test (через test:ci), build.
# Вернуть: раскомментировать push/pull_request ниже.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  # prisma.config.ts резолвит DATABASE_URL при любом запуске CLI, включая generate
  DATABASE_URL: 'file:./prisma/dev.db'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Security audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

      # Mirrors the Jenkinsfile stages. Test runs even when lint fails so a
      # formatting nit can never hide a red test again.
      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
