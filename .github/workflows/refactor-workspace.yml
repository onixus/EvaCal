name: PostgreSQL refactor verification
on:
  push:
    branches: [refactor/postgresql-only]
    paths: [.github/workflows/refactor-workspace.yml]
permissions:
  contents: read
concurrency:
  group: postgres-refactor-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgresql://evacal:evacal@127.0.0.1:5432/evacal?schema=public
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evacal
          POSTGRES_PASSWORD: evacal
          POSTGRES_DB: evacal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U evacal -d evacal"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate and validate PostgreSQL client
        id: generate
        run: |
          npx prisma generate
          npx prisma validate
      - name: Migration replay and PostgreSQL integration
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          npm run db:sync
          npm run db:sync
          npm run db:status
          npm run test:postgres
      - name: Custom PostgreSQL schema integration
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://evacal:evacal@127.0.0.1:5432/evacal?schema=refactor_probe
        run: |
          npm run db:sync
          npm run test:postgres
      - name: Lint
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit and regression tests
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: postgres-refactor-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: Installer and real Compose contracts
        if: ${{ !cancelled() }}
        run: npm run test:deploy
      - name: Production build
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run build
      - name: Verify a clean working tree
        if: ${{ !cancelled() }}
        run: |
          git diff --check
          git diff --exit-code
          test ! -d .github/refactor-payload
          echo "Verified commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
