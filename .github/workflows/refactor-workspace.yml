name: Refactor workspace
on:
  push:
    branches: [refactor/postgresql-only]
    paths: [.github/workflows/refactor-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for refactor verification
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/evacal-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: evacal-source
          path: ${{ runner.temp }}/evacal-source.tar.gz
          retention-days: 1
          if-no-files-found: error
