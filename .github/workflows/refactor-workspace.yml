name: PostgreSQL refactor verification
on:
  push:
    branches: [refactor/postgresql-only]
    paths: [.github/workflows/refactor-workspace.yml]
permissions:
  contents: write
concurrency:
  group: postgres-refactor-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgresql://evacal:evacal@127.0.0.1:5432/evacal?schema=public
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evacal
          POSTGRES_PASSWORD: evacal
          POSTGRES_DB: evacal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U evacal -d evacal"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, shutil
          root = Path.cwd().resolve()
          payload = root / '.github/refactor-payload'
          if payload.is_dir():
              raw = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in sorted(payload.iterdir())), validate=True))
              assert hashlib.sha256(raw).hexdigest() == '70b28763963b6fea17383407f42ea5c264254332cb511d87a124e5d5514fdad6', 'transport checksum mismatch'
              changes = json.loads(raw)
              before = {}
              digest = lambda b: hashlib.sha256(b).hexdigest() if b is not None else None
              for item in changes:
                  path = root / item['path']
                  assert path.resolve().is_relative_to(root) and '.git' not in path.parts
                  data = path.read_bytes() if path.is_file() else None
                  assert digest(data) == item['before'], f'base changed: {path}'
                  before[item['path']] = data
              after = {}
              for item in changes:
                  if item['after'] is None:
                      data = None
                  elif 'copy' in item:
                      data = before[item['copy']]
                  elif 'content' in item:
                      data = item['content'].encode()
                  else:
                      lines = before[item['path']].decode().splitlines(keepends=True)
                      for start, end, value in reversed(item['edits']):
                          lines[start:end] = [value]
                      data = ''.join(lines).encode()
                  assert digest(data) == item['after'], f'result checksum mismatch: {item["path"]}'
                  after[item['path']] = data
              for name, data in after.items():
                  path = root / name
                  if data is None:
                      path.unlink()
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(data)
              shutil.rmtree(payload)
              print(f'Applied {len(changes)} checksum-verified file operations.')
          else:
              print('Refactor payload already applied.')
          PY
      - name: Commit refactor on feature branch only
        run: |
          test "$GITHUB_REF_NAME" = refactor/postgresql-only
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows'
          if ! git diff --cached --quiet; then
            git commit -m "refactor(db): make PostgreSQL the only database and refresh architecture"
            git push origin HEAD:refs/heads/refactor/postgresql-only
          fi
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Generate and validate PostgreSQL client
        id: generate
        run: |
          npx prisma generate
          npx prisma validate
      - name: Migration replay and PostgreSQL integration
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          npm run db:sync
          npm run db:sync
          npm run db:status
          npm run test:postgres
      - name: Custom PostgreSQL schema integration
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://evacal:evacal@127.0.0.1:5432/evacal?schema=refactor_probe
        run: |
          npm run db:sync
          npm run test:postgres
      - name: Lint
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit and regression tests
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run test:ci
      - name: Installer and real Compose contracts
        if: ${{ !cancelled() }}
        run: npm run test:deploy
      - name: Production build
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run build
      - name: Save verification summary
        if: ${{ !cancelled() }}
        run: |
          git status --short
          git diff --check
          echo "Verified working tree based on $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: postgres-refactor-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 3
