# СУБД по умолчанию — PostgreSQL из сервиса `postgres` (см. README, «База данных»).
#   Внешний сервер: задать DATABASE_URL на него; встроенный тогда простаивает.
#   SQLite (один стенд, без отдельной СУБД): DATABASE_PROVIDER=sqlite и
#     DATABASE_URL=file:./prisma/dev.db в .env, база живёт в томе db-data.
# Клиент Prisma компилирует SQL под диалект СУБД, поэтому провайдер фиксируется
# на сборке образа (build-arg): после смены провайдера нужен `up --build`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evacal}
      POSTGRES_USER: ${POSTGRES_USER:-evacal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  # Schema sync & seed: runs automatically before `app` starts, or manually via
  # `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      target: migrate
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-evacal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evacal}?schema=public}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
    volumes:
      - db-data:/app/prisma

  app:
    build:
      context: .
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-evacal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evacal}?schema=public}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    volumes:
      - db-data:/app/prisma
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

volumes:
  db-data:
  pg-data:
