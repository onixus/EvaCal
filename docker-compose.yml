# СУБД по умолчанию — PostgreSQL из сервиса `postgres` (см. README, «База данных»).
#   Внешний сервер: задать DATABASE_URL на него; встроенный тогда простаивает.
#   SQLite (один стенд, без отдельной СУБД): DATABASE_PROVIDER=sqlite и
#     DATABASE_URL=file:./prisma/dev.db в .env, база живёт в томе db-data.
# Клиент Prisma компилирует SQL под диалект СУБД, поэтому провайдер фиксируется
# на сборке образа (build-arg): после смены провайдера нужен `up --build`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evacal}
      POSTGRES_USER: ${POSTGRES_USER:-evacal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  # Schema sync & seed: runs automatically before `app` starts, or manually via
  # `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      target: migrate
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-evacal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evacal}?schema=public}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
    volumes:
      - db-data:/app/prisma

  # Артефакты комплектов ГОСТ 34 (ZIP выпуска, DOCX тех.писателя).
  #   По умолчанию — файлы в томе storage-data (один экземпляр приложения).
  #   S3-совместимое хранилище (несколько реплик, централизованный бэкап):
  #   задать S3_BUCKET и S3_* в .env; встроенный MinIO — профилем:
  #   docker compose --profile minio up -d с S3_ENDPOINT=http://minio:9000.
  app:
    build:
      context: .
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-evacal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evacal}?schema=public}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      GOST_PACKAGE_STORAGE: ${GOST_PACKAGE_STORAGE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
    volumes:
      - db-data:/app/prisma
      # Файловый режим хранилища: без тома артефакты жили бы в слое контейнера
      # и исчезали при его пересоздании.
      - storage-data:/app/storage
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  minio:
    image: quay.io/minio/minio
    profiles: ['minio']
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-evacal}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required for the minio profile}
    volumes:
      - minio-data:/data
    expose:
      - '9000'
    ports:
      # Консоль MinIO только на loopback хоста
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

volumes:
  db-data:
  pg-data:
  storage-data:
  minio-data:
