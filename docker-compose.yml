services:
  # One-off schema sync: run before first `docker compose up` and after any schema
  # change, e.g. `docker compose run --rm migrate`. Not part of the default `up`.
  migrate:
    build:
      context: .
      target: migrate
    profiles: ['tools']
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:./prisma/dev.db}
    volumes:
      - db-data:/app/prisma

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:./prisma/dev.db}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    volumes:
      - db-data:/app/prisma
    expose:
      - '3000'

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  db-data:
