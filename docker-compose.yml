# Legacy source-development stack. For user installs use deploy/install.sh.
# PostgreSQL is the default; external DB / SQLite without an idle PostgreSQL
# container are supported by the separate overlays in deploy/.
# Prisma code stays in the image; db-data contains DATA, not /app/prisma code.
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'
x-database: &database
  DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-evacal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evacal}?schema=public}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evacal}
      POSTGRES_USER: ${POSTGRES_USER:-evacal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
  migrate:
    build:
      context: .
      target: migrate
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
    volumes:
      - db-data:/app/data
      - storage-data:/app/storage
  app:
    build:
      context: .
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SHARE_TOKEN_SECRET: ${SHARE_TOKEN_SECRET:-}
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-}
      EVACAL_LOCAL_HTTP: ${EVACAL_LOCAL_HTTP:-false}
      GOST_PACKAGE_STORAGE: ${GOST_PACKAGE_STORAGE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
    volumes:
      - db-data:/app/data
      - storage-data:/app/storage
    expose: ['3000']
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging: *logging
  minio:
    image: quay.io/minio/minio
    profiles: ['minio']
    restart: unless-stopped
    # Validate at container startup, not Compose interpolation: an inactive
    # optional profile must not require S3 credentials or fall back to defaults.
    entrypoint: ['/bin/sh', '-ec']
    command: [': "$${MINIO_ROOT_PASSWORD:?S3_SECRET_ACCESS_KEY is required for MinIO}"; exec minio server /data --console-address :9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-evacal}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - minio-data:/data
    expose: ['9000']
    ports: ['127.0.0.1:9001:9001']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    logging: *logging
volumes:
  db-data:
  pg-data:
  storage-data:
  minio-data:
