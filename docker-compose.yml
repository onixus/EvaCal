services:
  # Schema sync & seed: runs automatically before `app` starts, or manually via
  # `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:./prisma/dev.db}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
    volumes:
      - db-data:/app/prisma

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:./prisma/dev.db}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    volumes:
      - db-data:/app/prisma
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

volumes:
  db-data:
